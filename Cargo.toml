[workspace]
members = ["crates/*", "examples"]
resolver = "3"
exclude = ["./assets/"]

[workspace.package]
authors = ["Jan Hohenheim <jan@hohenheim.ch>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/janhohenheim/rerecast"
keywords = ["bevy", "recast", "navmesh", "navigation", "ai"]
categories = ["game-development"]
readme = "readme.md"

[workspace.dependencies]
# 0.8.0-dev matches the local bevy-main port patched in below.
avian3d = { version = "0.8.0-dev", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
slotmap = { version = "1", default-features = false }
ehttp = { version = "0.5", default-features = false }
rfd = "0.15"

# In sync with Bevy
thiserror = { version = "2", default-features = false }
wgpu-types = { version = "30", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
glam = { version = "0.33", default-features = false }
libm = { version = "0.2", default-features = false }
tracing = { version = "0.1", default-features = false }
critical-section = { version = "1", default-features = false }
anyhow = { version = "1", default-features = false }

# Bevy
## Bevy itself is only used in tests and examples, so we can use the default features.
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = true }
## Actual crate code should only depend on bevy_ crates with default features disabled.
bevy_reflect = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = [
    "glam",
] }
bevy_app = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_camera = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_light = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_remote = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_mesh = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_ecs = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_render = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_transform = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_asset = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_image = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_pbr = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_math = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_color = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_derive = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_platform = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_tasks = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_gizmos = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_material = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_utils = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }

# Workspace crates
rerecast = { version = "0.4", path = "crates/rerecast", default-features = false }
bevy_rerecast = { version = "0.5", path = "crates/bevy_rerecast", default-features = false }
bevy_rerecast_core = { version = "0.5", path = "crates/bevy_rerecast_core", default-features = false }
bevy_rerecast_editor_integration = { version = "0.5", path = "crates/bevy_rerecast_editor_integration", default-features = false }
avian_rerecast = { version = "0.6", path = "crates/avian_rerecast", default-features = false }
test_utils = { version = "0.1", path = "crates/test_utils", default-features = false }

# Other stuffs
bitflags = { version = "2", default-features = false }
flate2 = { version = "1", default-features = false, features = [
    "rust_backend",
] }
bincode = { version = "2", features = ["serde"], default-features = false }
# bevy_trenchbroom is not ported to bevy main yet.
# bevy_trenchbroom = { version = "0.14.0-rc.2", features = ["avian_f32"] }
approxim = "0.6"

[patch.crates-io]
# Local port of avian to bevy main (fork farm).
avian3d = { path = "/mnt/code/f/avian-main/crates/avian3d" }

# avian3d's support crates have local 17e28cde ports that are ahead of their
# GitHub bevy-main branches; use the local checkouts.
[patch."https://github.com/slyedoc/glam_matrix_extras"]
glam_matrix_extras = { path = "/mnt/code/f/glam_matrix_extras" }

[patch."https://github.com/slyedoc/bevy_transform_interpolation"]
bevy_transform_interpolation = { path = "/mnt/code/f/bevy_transform_interpolation" }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments, which would undesirably trigger this lint.
too_many_arguments = "allow"
# Queries may access many components, which would undesirably trigger this lint.
type_complexity = "allow"
# Make sure macros use their standard braces, such as `[]` for `bevy_ecs::children!`.
nonstandard_macro_braces = "warn"
# no_std support
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
